name: Test & Release

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Build and Test
      run: |
        echo "Running build and tests..."

    - name: Upload Artifacts
      if: ${{ inputs.skip-upload-to-release != 'true' }}
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts
        path: ./build

  release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip-upload-to-release }}

    steps:
    - name: Create Release
      run: |
        echo "Creating a new release..."
inputs:
  skip-upload-to-release:
    description: 'Skip uploading to releases while still uploading artifacts'
    required: false
    default: 'true'